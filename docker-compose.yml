services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
    volumes:
      - sqlite_data:/app/data
      - ./data/icons-preset:/app/data/icons-preset:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

volumes:
  sqlite_data:
